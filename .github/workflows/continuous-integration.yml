name: Continuous Integration

on:
  workflow_dispatch:
  pull_request: ~
  push:
    branches: ['main', '*.*.x']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --optimize-autoloader
      - run: composer validate --strict --ansi
      - run: composer dependency-analyser
      - run: composer normalize --dry-run --diff --ansi

  php-cs-fixer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.2]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, cs2pr
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --optimize-autoloader
      - run: composer fixcs -- --dry-run --diff --format=checkstyle --ansi | cs2pr

  rector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.2]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --optimize-autoloader
      - run: composer rector -- --dry-run

  psalm:
    # Runs once, on the newest supported PHP; --php-version below only changes which language
    # level Psalm analyzes *for*, so a single runtime still covers every target version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --optimize-autoloader
      - run: composer psalm -- --php-version=8.2 --stats --output-format=github --shepherd
      - run: composer psalm -- --php-version=8.3 --stats --output-format=github --shepherd
      - run: composer psalm -- --php-version=8.4 --stats --output-format=github --shepherd
      - run: composer psalm -- --php-version=8.5 --stats --output-format=github --shepherd

  phpunit:
    name: phpunit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        dependencies: [locked]
        include:
          # The lowest supported set (--prefer-lowest --prefer-stable), so PHPUnit 11 and Psalm 6
          # run in CI too. On the lowest supported PHP: it resolves to PHPUnit 11.5.50 (older 11.x
          # releases are blocked by Composer's security advisory check) and Psalm 6.10.0.
          - php: 8.2
            dependencies: lowest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --optimize-autoloader
      - run: composer test
